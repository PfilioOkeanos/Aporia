<style>.krone{animation:wieg 6s ease-in-out infinite;transform-origin:275px 100px}.ring{opacity:0;animation:ring 6s ease-out infinite;transform-origin:275px 150px}.r1{animation-delay:2s}.r2{animation-delay:4s}
