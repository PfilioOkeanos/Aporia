<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200" width="550" height="200">
<style>.bogen{animation:wachs 7s ease-in-out infinite}.w1{animation-delay:.6s}.w2{animation-delay:1.2s}
