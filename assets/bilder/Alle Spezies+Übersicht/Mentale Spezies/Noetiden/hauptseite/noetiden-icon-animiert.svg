<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200" width="550" height="200">
<style>.bahn{animation:bahn 3s linear infinite}.l0{animation-delay:0.0s}.l1{animation-delay:0.3s}.l2{animation-delay:0.6s}.l3{animation-delay:0.9s}.l4{animation-delay:1.2s}.l5{animation-delay:1.5s}.l6{animation-delay:1.8s}.l7{animation-delay:2.1s}.l8{animation-delay:2.4s}.l9{animation-delay:2.7s}
.kern{animation:kern 2.5s ease-in-out infinite}.k0{animation-delay:0.0s;transform-origin:275.0px 34.0px}.k1{animation-delay:0.5s;transform-origin:337.8px 79.6px}.k2{animation-delay:1.0s;transform-origin:313.8px 153.4px}.k3{animation-delay:1.5s;transform-origin:236.2px 153.4px}.k4{animation-delay:2.0s;transform-origin:212.2px 79.6px}
@keyframes bahn{to{stroke-dashoffset:0}}@keyframes kern{50%{transform:scale(.6);opacity:.6}}</style>
<defs><filter id="n" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feFlood flood-color="#a98bff"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="k" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#ffbf6b"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
