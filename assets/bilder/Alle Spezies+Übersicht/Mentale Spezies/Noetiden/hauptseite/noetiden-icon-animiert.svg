<g stroke="#a98bff" stroke-opacity=".28" stroke-width="1.2"><line x1="275.0" y1="34.0" x2="337.8" y2="79.6"/><line x1="275.0" y1="34.0" x2="313.8" y2="153.4"/><line x1="275.0" y1="34.0" x2="236.2" y2="153.4"/><line x1="275.0" y1="34.0" x2="212.2" y2="79.6"/><line x1="337.8" y1="79.6" x2="313.8" y2="153.4"/><line x1="337.8" y1="79.6" x2="236.2" y2="153.4"/><line x1="337.8" y1="79.6" x2="212.2" y2="79.6"/><line x1="313.8" y1="153.4" x2="236.2" y2="153.4"/><line x1="313.8" y1="153.4" x2="212.2" y2="79.6"/><line x1="236.2" y1="153.4" x2="212.2" y2="79.6"/></g>
