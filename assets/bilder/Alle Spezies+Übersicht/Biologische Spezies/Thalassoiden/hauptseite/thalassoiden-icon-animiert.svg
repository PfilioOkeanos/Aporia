<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200" width="550" height="200">
<style>.wellen{animation:welle 6s linear infinite}.ring{animation:puls 3.6s ease-in-out infinite;transform-origin:275px 92px}
.blase{opacity:0;animation:blase 5s ease-in infinite}.b0{animation-delay:0.0s}.b1{animation-delay:0.6s}.b2{animation-delay:1.2s}.b3{animation-delay:1.8s}.b4{animation-delay:2.4s}.b5{animation-delay:3.0s}.b6{animation-delay:3.6s}.b7{animation-delay:4.2s}
@keyframes welle{to{transform:translateX(-60px)}}@keyframes puls{50%{transform:scale(1.08);stroke-opacity:.4}}
@keyframes blase{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translate(10px,-170px)}}</style>
<defs><filter id="w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
