<circle class="ring" cx="275" cy="92" r="52" fill="none" stroke="#4ff0e0" stroke-width="2.5" filter="url(#w)"/>
<circle cx="275" cy="92" r="42" fill="#06212e" stroke="#d9b56a" stroke-width="1.5"/>
<path d="M275 58 C 290 78 292 100 275 126 C 258 100 260 78 275 58 Z M275 70 L275 120 M262 84 Q 245 92 248 112 M288 84 Q 305 92 302 112" fill="none" stroke="#d9b56a" stroke-width="2" stroke-linecap="round"/>
<g fill="none" stroke="#a8fff5" stroke-opacity=".8"><circle class="blase b0" cx="150" cy="190" r="2"/><circle class="blase b1" cx="184" cy="190" r="3"/><circle class="blase b2" cx="218" cy="190" r="4"/><circle class="blase b3" cx="252" cy="190" r="2"/><circle class="blase b4" cx="286" cy="190" r="3"/><circle class="blase b5" cx="320" cy="190" r="4"/><circle class="blase b6" cx="354" cy="190" r="2"/><circle class="blase b7" cx="388" cy="190" r="3"/></g>
