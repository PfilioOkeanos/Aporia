<details class="aporia-sidebar-section map-model-import">
    <summary class="aporia-sidebar-heading">Sternenkarte bearbeiten</summary>
    <div class="map-model-import-body">
        <label>Objekttyp
            <input type="text" data-model-type value="Planet" placeholder="z. B. Gesteinsplanet">
        </label>
        <label class="map-model-drop">
            GLB, FBX oder OBJ hier ablegen
            <input type="file" accept=".glb,.fbx,.obj" data-model-file disabled>
        </label>
        <p role="status">Import über den lokalen Aporia-Server.</p>
    </div>
</details>
