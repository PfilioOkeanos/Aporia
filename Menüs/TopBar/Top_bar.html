<header class="aporia-topbar">

    <!-- ============================================= -->

    <div class="aporia-topbar-start">
        <button class="aporia-sidebar-toggle-button" type="button" data-sidebar-visibility hidden
                aria-controls="aporia-sidebar-host" aria-expanded="true"

            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M9 5v14"/>
            </svg>
        </button>
    <a href="#" class="aporia-brand" data-route="home">

        <span class="aporia-brand-symbol">

            <svg viewBox="0 0 48 48" fill="none">
                <path d="M5 31 C12 8 36 8 43 31"
                      stroke="currentColor"
                      stroke-width="1.4"/>

                <path d="M24 4 V19 M17 11 H31"
                      stroke="currentColor"
                      stroke-width="1.2"/>

                <circle cx="24" cy="11" r="2.2"
                        fill="currentColor"/>

        </span>

        <span class="aporia-brand-text">

            <span class="aporia-brand-name">
                APORIA
            </span>

            <span class="aporia-brand-subtitle">
                WELTENARCHIV
            </span>

        </span>

    </a>
    </div>
