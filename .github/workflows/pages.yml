# APORIA-Weltenarchiv · Webfassung bauen und auf GitHub Pages veröffentlichen
# Läuft bei jedem Push auf main (und manuell über „Run workflow“).
# Baut mit scripts/web/webseite-bauen.mjs eine verkleinerte Kopie (_site) – das Repo selbst bleibt unverändert.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Werkzeuge installieren (ffmpeg, three.js, sharp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp

      - name: Webfassung bauen
        run: node scripts/web/webseite-bauen.mjs

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
