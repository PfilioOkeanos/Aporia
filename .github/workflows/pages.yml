# APORIA-Weltenarchiv · Webfassung bauen und auf GitHub Pages veröffentlichen
# Läuft bei jedem Push auf main (und manuell über „Run workflow“).
# Baut mit scripts/web/webseite-bauen.mjs eine verkleinerte Kopie (_site) – das Repo selbst bleibt unverändert.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Das Repo ist ca. 6 GB groß – vorinstallierte, ungenutzte Software entfernen, damit Platz ist
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Werkzeuge installieren (ffmpeg, three.js, sharp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp

      - name: Webfassung bauen
        run: node scripts/web/webseite-bauen.mjs

      # Originale und Git-Daten werden nach dem Bauen nicht mehr gebraucht – Platz für das Upload-Paket
      - name: Aufräumen vor dem Hochladen
        run: |
          rm -rf .git assets inhalte Info_material Menüs node_modules
          df -h /

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
